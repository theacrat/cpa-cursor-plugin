name: Release shared libraries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
      - run: mise run check
      - run: mise run test-host
      - name: Build release bundles
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mise run "build-$target"
            cp README.md LICENSE "dist/$target/"
            tar -czf "dist/cpa-cursor-$target.tar.gz" -C "dist/$target" .
          done
          shasum -a 256 dist/cpa-cursor-*.tar.gz > dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cpa-cursor-*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
